name: Heltec TFT baseline build

on:
  push:
    branches:
      - 'TFT-SPI-480×320'
    paths:
      - '.github/workflows/heltec-tft-baseline.yml'
      - '.github/constraints/**'
      - 'src/**'
      - 'lib/**'
      - 'extra_scripts/**'
      - 'bin/**'
      - 'variants/**'
      - 'platformio.ini'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: ${{ matrix.pio_env }} (compile-only)
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pio_env:
          - heltec-v4-r2-ili9488-p04
          - heltec-v4-r2-ili9488-p03
          - heltec-v4-r2-ili9488-p02
          - heltec-v4-tft
    runs-on: [self-hosted, Linux, X64]
    env:
      # Applied by uv in pioarduino's nested HybridCompile environment.
      UV_CONSTRAINT: ${{ github.workspace }}/.github/constraints/pioarduino-hybrid.txt
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Prepare PlatformIO
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/pio-venv"
          "$RUNNER_TEMP/pio-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/pio-venv/bin/python" -m pip install "platformio==6.2.0"
          "$RUNNER_TEMP/pio-venv/bin/pio" --version
          echo "Nested HybridCompile constraint: $UV_CONSTRAINT"
          cat "$UV_CONSTRAINT"
          echo "$RUNNER_TEMP/pio-venv/bin" >> "$GITHUB_PATH"
      - name: Test production P04 storage and GPIO contracts
        if: matrix.pio_env == 'heltec-v4-r2-ili9488-p04'
        run: python3 bin/test-heltec-v4-r2.py
      - name: Compile ${{ matrix.pio_env }} (NO FLASH)
        env:
          PIO_ENV: ${{ matrix.pio_env }}
        shell: bash
        run: |
          set -o pipefail
          pio run -j 2 -e "$PIO_ENV" 2>&1 | tee firmware-build.log
      - name: Save logs
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pio_env }}-build-log
          path: firmware-build.log
          if-no-files-found: warn
      - name: Save firmware for review (DO NOT FLASH)
        if: success()
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pio_env }}-compile-only-firmware
          path: .pio/build/${{ matrix.pio_env }}/*.bin
          compression-level: 0
          if-no-files-found: warn
